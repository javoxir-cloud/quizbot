<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f2f2f2;
    --card: #ffffff;
    --card2: #e9ecef;
    --text: #1d2125;
    --hint: #6a737b;
    --button: #0f6cbf;
    --button-text: #ffffff;
    --ok: #357a32;
    --ok-bg: #d4edda;
    --bad: #ca3120;
    --bad-bg: #f8d7da;
    --line: #dee2e6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  button { font-family: inherit; }
  .screen { display: none; padding: 14px 14px 110px; max-width: 560px; margin: 0 auto; }
  .screen.active { display: block; }
  .hidden { display: none !important; }

  .title { font-size: 22px; font-weight: 700; margin: 6px 0 4px; }
  .subtitle { color: var(--hint); font-size: 14px; margin-bottom: 14px; }
  .muted { color: var(--hint); }

  /* ---------- Bosh sahifa ---------- */
  .search {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; outline: none; margin-bottom: 10px;
  }
  .chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
  .chips-row::-webkit-scrollbar { display: none; }
  .fchip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .fchip.active { background: var(--button); border-color: var(--button); color: var(--button-text); }

  .bank-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 12px; margin-bottom: 10px;
    cursor: pointer; border-top: 4px solid #5b8def; transition: transform .08s ease;
  }
  .bank-card[data-subj="chem"] { border-top-color: #34c759; }
  .bank-card[data-subj="medchem"] { border-top-color: #ff9f0a; }
  .bank-card[data-subj="medbio"] { border-top-color: #ff375f; }
  .bank-card:active { transform: scale(0.985); }
  .bank-title { font-weight: 600; font-size: 16px; line-height: 1.3; margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12.5px;
    color: var(--text); background: rgba(255,255,255,0.03); white-space: nowrap;
  }
  .mini-bar { height: 4px; border-radius: 2px; background: var(--card2); margin-top: 10px; overflow: hidden; display: flex; }
  .mini-bar .ok { background: var(--ok); }
  .mini-bar .bad { background: var(--bad); }

  .summary {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .summary > div { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; }
  .summary b { display: block; font-size: 18px; }
  .summary span { font-size: 11.5px; color: var(--hint); }

  /* ---------- Bottom sheet ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0;
    padding: 16px 16px 24px; max-height: 92vh; overflow-y: auto;
    animation: up .18s ease;
  }
  @keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .sheet-head .t { flex: 1; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .x-btn { border: none; background: var(--card2); color: var(--text); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer; }
  .menu-item {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 4px; background: none; border: none;
    color: var(--text); font-size: 16px; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item .ic { width: 26px; text-align: center; font-size: 19px; }
  .menu-item small { display: block; color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .menu-item.danger { color: var(--bad); }

  .form-label { font-size: 15px; font-weight: 600; margin: 14px 0 8px; }
  .radio-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; }
  .radio-row input[type=radio], .check-row input { width: 20px; height: 20px; accent-color: var(--button); flex: 0 0 auto; }
  .radio-body { flex: 1; }
  .inp, .sel {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); font-size: 15px; outline: none;
  }
  .inp:disabled, .sel:disabled { opacity: .45; }
  .two { display: flex; gap: 10px; }
  .two > div { flex: 1; }
  .two small { color: var(--hint); font-size: 12px; }
  .check-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; cursor: pointer; font-size: 15px; }
  .check-row .cnt { margin-left: auto; color: var(--hint); font-size: 13px; }
  .check-row.off { opacity: .45; pointer-events: none; }
  .pool-info { margin-top: 10px; font-size: 13.5px; color: var(--hint); }

  .btn {
    display: block; width: 100%; text-align: center; background: var(--button); color: var(--button-text);
    border: none; border-radius: 12px; padding: 14px 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px;
  }
  .btn.secondary { background: var(--card2); color: var(--text); }
  .btn.outline { background: transparent; border: 1px solid var(--button); color: var(--button); }
  .btn:disabled { opacity: .45; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  /* ---------- Test ---------- */
  .q-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer; flex: 0 0 auto; }
  .q-header .mid { flex: 1; min-width: 0; }
  .q-header .mode { font-size: 12.5px; color: var(--hint); }
  .q-header .bt { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-header .right { text-align: right; font-size: 13px; color: var(--hint); flex: 0 0 auto; }
  .timer { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--bad); }

  .nav-strip { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 6px; scrollbar-width: none; }
  .nav-strip::-webkit-scrollbar { display: none; }
  .nav-num {
    flex: 0 0 auto; min-width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent;
    background: transparent; color: var(--text); font-size: 14px; cursor: pointer; padding: 0 6px;
  }
  .nav-num.answered { background: var(--card2); }
  .nav-num.ok { background: var(--ok-bg); color: var(--ok); }
  .nav-num.bad { background: var(--bad-bg); color: var(--bad); }
  .nav-num.cur { border-color: var(--button); }

  .q-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .q-text { padding: 16px; font-size: 17px; font-weight: 600; line-height: 1.42; }
  .q-num { display: inline-block; font-size: 12px; color: var(--hint); font-weight: 500; margin-bottom: 6px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: transparent;
    color: var(--text); border: none; border-top: 1px solid var(--line); padding: 14px 16px; font-size: 15.5px; line-height: 1.35; cursor: pointer;
  }
  .option .dot { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--hint); margin-top: 1px; position: relative; }
  .option.sel { background: rgba(46,166,255,0.12); }
  .option.sel .dot { border-color: var(--button); }
  .option.sel .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--button); }
  .option.correct { background: var(--ok-bg); }
  .option.correct .dot { border-color: var(--ok); }
  .option.correct .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--ok); }
  .option.wrong { background: var(--bad-bg); }
  .option.wrong .dot { border-color: var(--bad); }
  .option.wrong .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--bad); }
  .option.locked { cursor: default; }
  .q-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding: 8px 10px; }
  .fav-btn { border: none; background: none; font-size: 22px; cursor: pointer; padding: 6px; color: var(--bad); }
  .q-foot .st { font-size: 13px; color: var(--hint); padding-right: 6px; }

  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .bottom-bar .inner { max-width: 532px; margin: 0 auto; display: flex; gap: 10px; }
  .bottom-bar .btn { margin-top: 0; }
  .bottom-bar .btn.sm { flex: 0 0 64px; }

  /* ---------- Natija ---------- */
  .result-score { font-size: 44px; font-weight: 800; text-align: center; margin: 14px 0 2px; }
  .result-sub { text-align: center; color: var(--hint); margin-bottom: 16px; font-size: 15px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-grid > div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 6px; text-align: center; }
  .stat-grid b { display: block; font-size: 20px; }
  .stat-grid span { font-size: 12px; color: var(--hint); }
  .sec-title { font-weight: 700; margin: 18px 0 8px; font-size: 16px; }
  .review-item { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14.5px; line-height: 1.4; }
  .review-item .rq { font-weight: 600; margin-bottom: 6px; }
  .review-item .ra { color: var(--ok); }
  .review-item .rw { color: var(--bad); }
  .review-item .ro { padding: 3px 0; }

  .big-bar { height: 10px; border-radius: 5px; background: var(--card2); overflow: hidden; display: flex; margin: 6px 0 14px; }
  .big-bar .ok { background: var(--ok); }
  .big-bar .bad { background: var(--bad); }
  .hist-row { display: flex; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font-size: 14px; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }

  /* ================= Moodle uslubi (test, yakunlash, natija ekranlari) ================= */
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .home-banner { margin: -14px -14px 14px; }
  .home-banner .m-course { font-size: 24px; }
  body.moodle .screen.mscreen { padding: 0 0 40px; max-width: 760px; }
  .m-page { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #1d2125; font-size: 15px; }
  .m-banner {
    background: linear-gradient(100deg, #0c3fb8 0%, #1565d8 45%, #3b8fe8 100%);
    color: #fff; padding: 22px 16px 26px; position: relative; overflow: hidden;
  }
  .m-banner::after {
    content: ""; position: absolute; right: -40px; top: -60px; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.18), rgba(255,255,255,0) 70%);
  }
  .m-banner .m-course { font-size: 27px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; line-height: 1.15; }
  .m-banner .m-crumb { font-size: 13px; opacity: .85; margin-top: 6px; }
  .m-topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #dee2e6; }
  .m-link { color: #0f6cbf; background: none; border: none; font-size: 14px; padding: 4px 0; cursor: pointer; text-decoration: none; }
  .m-link:active { text-decoration: underline; }
  .m-timer { border: 1px solid #dee2e6; background: #fff; border-radius: 4px; padding: 5px 10px; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .m-timer.low { background: #f8d7da; border-color: #f1aeb5; color: #842029; font-weight: 600; }
  .m-body { padding: 12px; }

  .que { margin-bottom: 14px; }
  .que .info {
    background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 8px 10px; margin-bottom: 8px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 13px; color: #495057;
  }
  .que .info .no { font-size: 15px; color: #1d2125; margin: 0; font-weight: 400; width: 100%; }
  .que .info .no b { font-size: 21px; font-weight: 700; }
  .que .info .flag { color: #0f6cbf; cursor: pointer; background: none; border: none; padding: 0; font-size: 13px; }
  .que .info .flag.on { color: #ca3120; }
  .que .formulation { background: #e7f3f5; border: 1px solid #b8dce2; border-radius: 4px; padding: 14px 14px 10px; color: #001a1e; }
  .que .qtext { font-size: 16px; line-height: 1.45; margin-bottom: 16px; }
  .que .prompt { font-size: 14.5px; margin-bottom: 8px; }
  .que .ans-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 4px; border-radius: 4px; cursor: pointer; line-height: 1.4; }
  .que .ans-row input { width: 17px; height: 17px; margin: 2px 0 0; flex: 0 0 auto; accent-color: #0f6cbf; }
  .que .ans-row .lbl { flex: 1; }
  .que .ans-row .mk { flex: 0 0 auto; font-weight: 700; width: 18px; text-align: center; }
  .que .ans-row.correct { background: #d4edda; }
  .que .ans-row.correct .mk { color: #357a32; }
  .que .ans-row.incorrect { background: #f8d7da; }
  .que .ans-row.incorrect .mk { color: #ca3120; }
  .que.locked .ans-row { cursor: default; }
  .que .outcome { background: #fcefdc; border: 1px solid #fbe0b9; border-radius: 4px; padding: 10px 14px; margin-top: 8px; color: #7d5a29; font-size: 14.5px; line-height: 1.4; }
  .que .outcome .fb-ok { color: #357a32; font-weight: 600; }
  .que .outcome .fb-bad { color: #ca3120; font-weight: 600; }

  .m-btns { display: flex; justify-content: space-between; gap: 10px; margin: 6px 0 16px; }
  .m-btn {
    border: 1px solid transparent; border-radius: 6px; padding: 9px 16px; font-size: 15px; cursor: pointer;
    background: #0f6cbf; color: #fff; font-family: inherit;
  }
  .m-btn:active { background: #0c5699; }
  .m-btn.sec { background: #ced4da; color: #1d2125; }
  .m-btn.sec:active { background: #b8c0c8; }
  .m-btn.ghost { background: #fff; color: #0f6cbf; border-color: #0f6cbf; }
  .m-btn:disabled { opacity: .5; }
  .m-btn.full { width: 100%; margin-top: 8px; }

  .m-block { background: #fff; border: 1px solid #dee2e6; border-radius: 6px; padding: 12px; margin-top: 6px; }
  .m-block h5 { margin: 0 0 10px; font-size: 16px; font-weight: 700; }
  .qn-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .qnbutton {
    width: 34px; height: 40px; border: 1px solid #ced4da; border-radius: 3px; background: #fff; color: #1d2125;
    font-size: 13px; cursor: pointer; position: relative; overflow: hidden; padding: 0 0 12px; font-family: inherit;
  }
  .qnbutton::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: transparent; border-top: 1px solid #e9ecef; }
  .qnbutton.answered::after { background: #ced4da; }
  .qnbutton.correct::after { background: #357a32; }
  .qnbutton.incorrect::after { background: #ca3120; }
  .qnbutton.thispage { border: 2px solid #1d2125; font-weight: 700; }
  .qnbutton.flagged::before { content: ""; position: absolute; right: 0; top: 0; border-left: 9px solid transparent; border-top: 9px solid #ca3120; }
  .m-block .m-link { margin-top: 10px; display: inline-block; }

  .m-h2 { font-size: 21px; font-weight: 600; margin: 4px 0 12px; }
  .m-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; margin-bottom: 14px; }
  .m-table th, .m-table td { border: 1px solid #dee2e6; padding: 8px 10px; text-align: left; vertical-align: top; }
  .m-table th { background: #f8f9fa; font-weight: 600; width: 42%; }
  .m-table.m-sumtbl th { width: auto; }
  .m-table tr.unans td { color: #ca3120; }
  .m-note { font-size: 13.5px; color: #495057; margin: 8px 0; }
</style>
</head>
<body>

<!-- 1. Bosh sahifa: banklar ro'yxati -->
<div id="screen-home" class="screen active">
  <div class="m-banner home-banner"><div class="m-course">Test banklari</div><div class="m-crumb">Mashq testi va imtihon rejimi</div></div>
  <div class="summary" id="home-summary"></div>
  <input class="search" id="bank-search" placeholder="🔍 Bank qidirish..." />
  <div class="chips-row" id="subject-chips"></div>
  <div id="bank-list"></div>
</div>

<!-- 2. Test jarayoni (Moodle uslubida) -->
<div id="screen-quiz" class="screen mscreen m-page">
  <div class="m-banner"><div class="m-course" id="m-course"></div><div class="m-crumb" id="m-crumb"></div></div>
  <div class="m-topbar">
    <button class="m-link" id="quiz-back">← Выйти из теста</button>
    <div class="m-timer hidden" id="quiz-timer"></div>
  </div>
  <div class="m-body">
    <div id="que-box"></div>
    <div class="m-btns">
      <button class="m-btn sec" id="btn-prev">Предыдущая страница</button>
      <button class="m-btn" id="btn-next">Следующая страница</button>
    </div>
    <div class="m-block">
      <h5>Навигация по тесту</h5>
      <div class="qn-grid" id="nav-strip"></div>
      <button class="m-link" id="btn-finish-link">Закончить попытку...</button>
    </div>
  </div>
</div>

<!-- 2b. Yakunlash oldidan (Moodle "Результат попытки") -->
<div id="screen-summary" class="screen mscreen m-page">
  <div class="m-banner"><div class="m-course" id="s-course"></div><div class="m-crumb" id="s-crumb"></div></div>
  <div class="m-body">
    <div class="m-h2">Результат попытки</div>
    <table class="m-table m-sumtbl"><thead><tr><th>Вопрос</th><th>Состояние</th></tr></thead><tbody id="sum-rows"></tbody></table>
    <button class="m-btn sec full" id="btn-sum-back">Вернуться к попытке</button>
    <div class="m-note" id="sum-note"></div>
    <button class="m-btn full" id="btn-sum-submit">Отправить всё и завершить тест</button>
  </div>
</div>

<!-- 3. Natija (Moodle "Просмотр попытки") -->
<div id="screen-result" class="screen mscreen m-page">
  <div class="m-banner"><div class="m-course" id="r-course"></div><div class="m-crumb" id="r-crumb"></div></div>
  <div class="m-body">
    <table class="m-table" id="result-table"></table>
    <button class="m-btn full" id="btn-retry-wrong">Xatolarni qayta ishlash</button>
    <div class="m-btns" style="margin-top:8px">
      <button class="m-btn sec" id="btn-retry" style="flex:1">Qaytadan</button>
      <button class="m-btn ghost" id="btn-res-home" style="flex:1">Banklarga qaytish</button>
    </div>
    <div id="result-review"></div>
  </div>
</div>

<!-- 4. Ko'rish (barcha savollar + to'g'ri javoblar) -->
<div id="screen-view" class="screen">
  <div class="q-header">
    <button class="icon-btn" id="view-back">←</button>
    <div class="mid"><div class="mode">Ko'rish</div><div class="bt" id="view-bank"></div></div>
  </div>
  <input class="search" id="view-search" placeholder="🔍 Savol yoki javob bo'yicha qidirish..." />
  <div class="chips-row" id="view-chips"></div>
  <div id="view-list"></div>
</div>

<!-- 5. Statistika -->
<div id="screen-stats" class="screen">
  <div class="q-header">
    <button class="icon-btn" id="stats-back">←</button>
    <div class="mid"><div class="mode">Statistika</div><div class="bt" id="stats-bank"></div></div>
  </div>
  <div id="stats-body"></div>
</div>

<!-- Bank menyusi -->
<div class="overlay" id="ov-bank">
  <div class="sheet">
    <div class="sheet-head"><div class="t" id="bank-sheet-title"></div><button class="x-btn" data-close>✕</button></div>

    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================= Saqlash (localStorage + Telegram CloudStorage) =================
   Har bir bank uchun: c = oxirgi marta to'g'ri javob berilgan savollar,
   w = oxirgi marta xato javob berilgan, f = sevimlilar, h = urinishlar tarixi.
   Savollar bankdagi tartib raqami (0 dan) bilan saqlanadi. */
const Store = {
  data: {},
  k(b) { return 'qb_' + b; },
  norm(v) {
    v = v || {};
    return { c: v.c || [], w: v.w || [], f: v.f || [], h: v.h || [], t: v.t || 0 };
  },
  get(b) {
    if (!this.data[b]) {
      let v = null;
      try { v = JSON.parse(localStorage.getItem(this.k(b))); } catch (e) {}
      this.data[b] = this.norm(v);
    }
    return this.data[b];
  },
  save(b) {
    const d = this.get(b);
    d.t = Date.now();
    const s = JSON.stringify(d);
    try { localStorage.setItem(this.k(b), s); } catch (e) {}
    if (cloudOK()) { try { tg.CloudStorage.setItem(this.k(b), s, () => {}); } catch (e) {} }
  },
  answer(b, qi, ok) {
    const d = this.get(b);
    d.c = d.c.filter(x => x !== qi);
    d.w = d.w.filter(x => x !== qi);
    (ok ? d.c : d.w).push(qi);
  },
  isFav(b, qi) { return this.get(b).f.includes(qi); },
  toggleFav(b, qi) {
    const d = this.get(b);
    if (d.f.includes(qi)) d.f = d.f.filter(x => x !== qi); else d.f.push(qi);
    this.save(b);
    return d.f.includes(qi);
  },
  addHistory(b, rec) {
    const d = this.get(b);
    d.h.push(rec);
    if (d.h.length > 15) d.h = d.h.slice(-15);
  },
  reset(b) {
    this.data[b] = this.norm(null);
    this.save(b);
  },
  syncFromCloud(done) {
    if (!cloudOK()) return done && done();
    const keys = BANKS.map(b => this.k(b.key));
    const chunks = [];
    for (let i = 0; i < keys.length; i += 20) chunks.push(keys.slice(i, i + 20));
    let left = chunks.length, changed = false;
    chunks.forEach(ch => {
      try {
        tg.CloudStorage.getItems(ch, (err, vals) => {
          if (!err && vals) {
            Object.keys(vals).forEach(key => {
              if (!vals[key]) return;
              try {
                const cv = this.norm(JSON.parse(vals[key]));
                const bk = key.slice(3);
                const lv = this.get(bk);
                if (cv.t > lv.t) {
                  this.data[bk] = cv;
                  try { localStorage.setItem(key, vals[key]); } catch (e) {}
                  changed = true;
                }
              } catch (e) {}
            });
          }
          if (--left === 0 && done) done(changed);
        });
      } catch (e) { if (--left === 0 && done) done(changed); }
    });
  },
};
function cloudOK() {
  return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
}

    const n = (questionBanks[b.key] || []).length;
    const d = Store.get(b.key);
    totQ += n; totC += d.c.length; totW += d.w.length; totF += d.f.length;

    chips.appendChild(el('span', 'chip', `❓ ${n}`));
    const pct = n ? Math.round(d.c.length / n * 100) : 0;
    chips.appendChild(el('span', 'chip', `🎓 ${d.c.length} / ${pct}%`));
    if (d.w.length) chips.appendChild(el('span', 'chip', `✗ ${d.w.length}`));
    if (d.f.length) chips.appendChild(el('span', 'chip', `♥ ${d.f.length}`));
    if (d.h.length) chips.appendChild(el('span', 'chip', `🔁 ${d.h.length}`));
    card.appendChild(chips);
    if (d.c.length || d.w.length) {

  if (!list.children.length) list.appendChild(el('div', 'empty', 'Hech narsa topilmadi'));

  const sum = $('home-summary');

  [[totQ, 'savol'], [totC, "to'g'ri"], [totW, 'xato'], [totF, 'sevimli']].forEach(([v, l]) => {
    const d = el('div'); d.appendChild(el('b', '', String(v))); d.appendChild(el('span', '', l)); sum.appendChild(d);
  });
}

let setupMode = 'train';
function openSetup(mode) {
  setupMode = mode;
  const pool = questionBanks[currentBankKey] || [];
  const n = pool.length;
  const d = Store.get(currentBankKey);
  $('setup-title').textContent = mode === 'exam' ? 'Imtihonni boshlash' : 'Mashq testini boshlash';

  const sel = $('s-random');
  sel.innerHTML = '';
  [10, 20, 25, 30, 50, 100].filter(x => x < n).concat([n]).forEach(v => {
    const o = el('option', '', v === n ? `Hammasi (${n})` : String(v)); o.value = v; sel.appendChild(o);
  });
  const pref = [...sel.options].find(o => +o.value === Math.min(n, mode === 'exam' ? 25 : 10));
  if (pref) sel.value = pref.value;

  $('s-from').value = 1; $('s-to').value = n;
  $('s-from').max = n; $('s-to').max = n;
  $('s-time').value = mode === 'exam' ? '30' : '0';
  document.querySelector('input[name=qmode][value=all]').checked = true;
  ['f-un', 'f-wr', 'f-fav'].forEach(id => $(id).checked = false);

  const answered = new Set(d.c.concat(d.w));
  $('c-un').textContent = n - answered.size;
  $('c-wr').textContent = d.w.length;
  $('c-fav').textContent = d.f.length;
  $('row-wr').classList.toggle('off', !d.w.length);
  $('row-fav').classList.toggle('off', !d.f.length);
  $('row-un').classList.toggle('off', answered.size >= n);
  syncSetupUI();
  openSheet('ov-setup');
}

function readSetup() {
  const pool = questionBanks[currentBankKey] || [];
  const n = pool.length;
  const d = Store.get(currentBankKey);
  const qmode = document.querySelector('input[name=qmode]:checked').value;
  let idxs = [...Array(n).keys()];

  if (qmode === 'range') {
    let a = parseInt($('s-from').value, 10), b = parseInt($('s-to').value, 10);
    if (!(a >= 1)) a = 1; if (!(b >= 1)) b = n;
    a = Math.min(a, n); b = Math.min(b, n);
    if (a > b) [a, b] = [b, a];
    idxs = idxs.slice(a - 1, b);
  }
  // Filtrlar bir-biriga "YOKI" bilan qo'shiladi (masalan: xatolar + sevimlilar)
  const fUn = $('f-un').checked, fWr = $('f-wr').checked, fFav = $('f-fav').checked;
  if (fUn || fWr || fFav) {
    const answered = new Set(d.c.concat(d.w));
    const wr = new Set(d.w), fav = new Set(d.f);
    idxs = idxs.filter(i => (fUn && !answered.has(i)) || (fWr && wr.has(i)) || (fFav && fav.has(i)));
  }
  if (qmode === 'random') {
    idxs = shuffle(idxs).slice(0, parseInt($('s-random').value, 10) || idxs.length);
  }
  return {
    idxs,
    shuffleQ: $('f-shq').checked || qmode === 'random',
    shuffleA: $('f-sha').checked,
    timeLimit: (parseInt($('s-time').value, 10) || 0) * 60,
  };
}

function syncSetupUI() {
  const qmode = document.querySelector('input[name=qmode]:checked').value;
  $('s-random').disabled = qmode !== 'random';
  $('s-from').disabled = $('s-to').disabled = qmode !== 'range';
  const cnt = readSetup().idxs.length;
  $('pool-info').textContent = cnt ? `Testda ${cnt} ta savol bo'ladi` : 'Tanlangan shartlarga mos savol yo\'q';
  $('s-start').disabled = !cnt;
}
document.querySelectorAll('#ov-setup input, #ov-setup select').forEach(i => {
  i.addEventListener('change', syncSetupUI);
  i.addEventListener('input', syncSetupUI);
});
// Tanlov maydoniga bosilganda tegishli rejim avtomatik tanlansin
$('s-random').addEventListener('focus', () => { document.querySelector('input[name=qmode][value=random]').checked = true; syncSetupUI(); });
['s-from', 's-to'].forEach(id => $(id).addEventListener('focus', () => { document.querySelector('input[name=qmode][value=range]').checked = true; syncSetupUI(); }));

$('s-start').onclick = () => {
  const s = readSetup();
  if (!s.idxs.length) return;
  closeSheet('ov-setup');
  startSession(currentBankKey, setupMode, s.shuffleQ ? shuffle(s.idxs) : s.idxs, s);
};

/* ================= Test jarayoni (Moodle uslubida) ================= */
let S = null; // joriy sessiya
let lastSetup = null;
const COURSE_NAMES = { bio: 'Биология', chem: 'Химия', medchem: 'Медицинская химия', medbio: 'Медицинская биология' };
const LETTERS = 'abcdefghij';

function setMoodleChrome(on) {
  document.body.classList.toggle('moodle', on);
  try {
    if (tg && tg.setHeaderColor) tg.setHeaderColor('#ffffff');
    if (tg && tg.setBackgroundColor) tg.setBackgroundColor('#f2f2f2');
  } catch (e) {}
}
function fillBanner(prefix, bankKey, extra) {
  $(prefix + 'course').textContent = COURSE_NAMES[subjOf(bankKey)] || 'Тест';
  $(prefix + 'crumb').textContent = cleanTitle(bankByKey(bankKey).title) + (extra ? ' · ' + extra : '');
}
const MOODLE_SCREENS = ['screen-quiz', 'screen-summary', 'screen-result'];
const _showScreen = showScreen;
showScreen = function (id) { setMoodleChrome(MOODLE_SCREENS.includes(id)); _showScreen(id); };

function startSession(bankKey, mode, idxs, opts) {
  const pool = questionBanks[bankKey] || [];
  lastSetup = { bankKey, mode, idxs: idxs.slice(), opts };
  stopTimer();
  S = {
    bank: bankKey, mode,
    items: idxs.map(qi => {
      const it = pool[qi];
      return { qi, q: it.q, correct: it.correct, options: opts.shuffleA ? shuffle(it.options) : it.options.slice(), chosen: null };
    }),
    cur: 0,
    timeLimit: opts.timeLimit || 0,
    startedAt: Date.now(),
    finishedAt: null,
    timerId: null,
    finished: false,
  };
  fillBanner('m-', bankKey, mode === 'exam' ? 'Imtihon' : 'Mashq');
  showScreen('screen-quiz');
  buildNavStrip();
  renderQuestion();
  startTimer();
}

function isCorrect(item) { return item.chosen !== null && item.chosen.trim() === item.correct.trim(); }
function revealed(item) { return S.mode === 'train' && item.chosen !== null; }

function buildNavStrip() {
  const grid = $('nav-strip');
  grid.innerHTML = '';
  S.items.forEach((_, i) => {
    const b = el('button', 'qnbutton', String(i + 1));
    b.onclick = () => { S.cur = i; renderQuestion(); window.scrollTo(0, 0); };
    grid.appendChild(b);
  });
}
function updateNavStrip() {
  const btns = $('nav-strip').children;
  S.items.forEach((it, i) => {
    let cls = 'qnbutton';
    if (it.chosen !== null) cls += revealed(it) ? (isCorrect(it) ? ' correct' : ' incorrect') : ' answered';
    if (Store.isFav(S.bank, it.qi)) cls += ' flagged';
    if (i === S.cur) cls += ' thispage';
    btns[i].className = cls;
  });
}

// Moodle'dagi bitta savol bloki: chapda "Вопрос N" ma'lumoti, o'ngda (mobil: pastda) savol matni
function renderQue(it, num, opts) {
  const { review = false, interactive = false, onChoose = null, onFlag = null } = opts;
  const showRes = review || revealed(it);
  const que = el('div', 'que' + (showRes || !interactive ? ' locked' : ''));

  const info = el('div', 'info');
  const no = el('h3', 'no'); no.append('Вопрос '); no.appendChild(el('b', '', String(num)));
  info.appendChild(no);
  let state;
  if (showRes) state = it.chosen === null ? 'Ответ не дан' : (isCorrect(it) ? 'Верно' : 'Неверно');
  else state = it.chosen === null ? 'Пока нет ответа' : 'Ответ сохранен';
  info.appendChild(el('div', 'state', state));
  info.appendChild(el('div', 'grade', showRes ? `Баллов: ${isCorrect(it) ? '1,00' : '0,00'} из 1,00` : 'Балл: 1,00'));
  if (onFlag) {
    const fl = Store.isFav(S.bank, it.qi);
    const f = el('button', 'flag' + (fl ? ' on' : ''), fl ? '⚑ Убрать флажок' : '⚐ Отметить вопрос');
    f.onclick = onFlag;
    info.appendChild(f);
  }
  que.appendChild(info);

  const form = el('div', 'formulation');
  form.appendChild(el('div', 'qtext', it.q));
  form.appendChild(el('div', 'prompt', 'Выберите один ответ:'));
  const name = 'q' + num + '_' + Math.random().toString(36).slice(2, 7);
  it.options.forEach((opt, k) => {
    const row = el('label', 'ans-row');
    const inp = document.createElement('input');
    inp.type = 'radio'; inp.name = name;
    inp.checked = it.chosen === opt;
    inp.disabled = showRes || !interactive;
    if (!inp.disabled) inp.onchange = () => onChoose && onChoose(opt);
    row.appendChild(inp);
    row.appendChild(el('span', 'lbl', `${LETTERS[k] || '•'}. ${opt}`));
    if (showRes && it.chosen === opt) {
      const ok = isCorrect(it);
      row.classList.add(ok ? 'correct' : 'incorrect');
      row.appendChild(el('span', 'mk', ok ? '✓' : '✗'));
    }
    form.appendChild(row);
  });
  que.appendChild(form);

  if (showRes) {
    const out = el('div', 'outcome');
    if (it.chosen !== null) out.appendChild(el('div', isCorrect(it) ? 'fb-ok' : 'fb-bad', isCorrect(it) ? 'Ваш ответ верный.' : 'Ваш ответ неправильный.'));
    out.appendChild(el('div', '', 'Правильный ответ: ' + it.correct));
    que.appendChild(out);
  }
  return que;
}

function renderQuestion() {
  const it = S.items[S.cur];
  const box = $('que-box');
  box.innerHTML = '';
  box.appendChild(renderQue(it, S.cur + 1, {
    interactive: true,
    onChoose: (opt) => choose(opt),
    onFlag: () => { Store.toggleFav(S.bank, it.qi); renderQuestion(); },
  }));
  $('btn-prev').style.visibility = S.cur === 0 ? 'hidden' : 'visible';
  const last = S.cur === S.items.length - 1;
  $('btn-next').textContent = last ? 'Закончить попытку...' : 'Следующая страница';
  updateNavStrip();
}

function choose(opt) {
  const it = S.items[S.cur];
  if (S.mode === 'train') {
    if (it.chosen !== null) return;
    it.chosen = opt;
    const ok = isCorrect(it);
    haptic(ok ? 'success' : 'error');
    Store.answer(S.bank, it.qi, ok);   // mashqda statistika darhol yoziladi
    Store.save(S.bank);
  } else {
    it.chosen = opt;
    try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
  renderQuestion();
}

$('btn-prev').onclick = () => { if (S.cur > 0) { S.cur--; renderQuestion(); window.scrollTo(0, 0); } };
$('btn-next').onclick = () => {

};

/* ---------- Taymer (Moodle: "Оставшееся время") ---------- */
function startTimer() {
  const t = $('quiz-timer');
  t.classList.toggle('hidden', !S.timeLimit);
  if (!S.timeLimit) return;
  const tick = () => {
    if (!S || S.finished) return;
    const rem = S.timeLimit - (Date.now() - S.startedAt) / 1000;
    const h = Math.floor(Math.max(0, rem) / 3600);
    t.textContent = 'Оставшееся время ' + h + ':' + fmtTime(Math.max(0, rem) - h * 3600).padStart(5, '0');
    t.classList.toggle('low', rem <= 60);
    if (rem <= 0) {
      stopTimer();
      if (tg && tg.showAlert) { try { tg.showAlert('Время истекло!'); } catch (e) {} }
      finishQuiz();
    }
  };
  tick();
  S.timerId = setInterval(tick, 1000);
}
function stopTimer() { if (S && S.timerId) { clearInterval(S.timerId); S.timerId = null; } }

/* ================= Natija (Moodle "Просмотр попытки") ================= */
function fmtDT(ts) {
  const d = new Date(ts), p = (n) => String(n).padStart(2, '0');
  const days = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDur(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m ? `${m} мин. ` : '') + `${s} сек.`;
}
const num2 = (x) => x.toFixed(2).replace('.', ',');

function finishQuiz() {
  if (!S || S.finished) return;
  S.finished = true;
  S.finishedAt = Date.now();
  stopTimer();
  const total = S.items.length;
  const correct = S.items.filter(isCorrect).length;
  const dur = Math.round((S.finishedAt - S.startedAt) / 1000);
  // Imtihonda statistika faqat oxirida yoziladi
  if (S.mode === 'exam') S.items.forEach(it => { if (it.chosen !== null) Store.answer(S.bank, it.qi, isCorrect(it)); });
  Store.addHistory(S.bank, { d: Date.now(), m: S.mode === 'exam' ? 'e' : 't', s: correct, n: total, u: dur });
  Store.save(S.bank);

  S.mode = 'review';
  fillBanner('r-', S.bank, 'Просмотр попытки');
  const grade = total ? correct / total * 100 : 0;
  const rows = [
    ['Тест начат', fmtDT(S.startedAt)],
    ['Состояние', 'Завершены'],
    ['Завершен', fmtDT(S.finishedAt)],
    ['Прошло времени', fmtDur(dur)],
    ['Баллы', `${num2(correct)}/${num2(total)}`],
    ['Оценка', `${num2(grade)} из 100,00 (${Math.round(grade)}%)`],
  ];
  const tbl = $('result-table');
  tbl.innerHTML = '';
  rows.forEach(([k, v]) => {
    const tr = el('tr'); tr.appendChild(el('th', '', k));
    const td = el('td', '', v); if (k === 'Оценка') td.style.fontWeight = '700';
    tr.appendChild(td); tbl.appendChild(tr);
  });
  haptic(grade >= 60 ? 'success' : 'warning');

  const bad = S.items.filter(it => !isCorrect(it));
  $('btn-retry-wrong').classList.toggle('hidden', !bad.length);
  $('btn-retry-wrong').textContent = `Xatolarni qayta ishlash (${bad.length})`;
  const bank = S.bank;
  $('btn-retry-wrong').onclick = () => startSession(bank, 'train', bad.map(x => x.qi), { shuffleQ: false, shuffleA: true, timeLimit: 0 });

  const rev = $('result-review');
  rev.innerHTML = '';
  S.items.forEach((it, i) => rev.appendChild(renderQue(it, i + 1, { review: true })));
  showScreen('screen-result');
}
$('btn-retry').onclick = () => {
  if (!lastSetup) return;
  const { bankKey, mode, idxs, opts } = lastSetup;
  startSession(bankKey, mode, opts.shuffleQ ? shuffle(idxs) : idxs, opts);
};

/* ================= Statistika ================= */
function openStats(key) {
  currentBankKey = key;
  $('stats-bank').textContent = cleanTitle(bankByKey(key).title);
  renderStats();

}
function renderStats() {
  const key = currentBankKey;
  const n = (questionBanks[key] || []).length;
  const d = Store.get(key);
  const body = $('stats-body');
  body.innerHTML = '';
  const answered = d.c.length + d.w.length;
  const acc = answered ? Math.round(d.c.length / answered * 100) : 0;

  const grid = el('div', 'stat-grid');
  [[n, 'Jami savol'], [answered, 'Ishlangan'], [n - answered, 'Ishlanmagan'],
   [d.c.length, "To'g'ri"], [d.w.length, 'Xato'], [d.f.length, 'Sevimli']].forEach(([v, l]) => {
    const x = el('div'); x.appendChild(el('b', '', String(v))); x.appendChild(el('span', '', l)); grid.appendChild(x);
  });
  body.appendChild(grid);

  body.appendChild(el('div', 'muted', `O'zlashtirish: ${n ? Math.round(d.c.length / n * 100) : 0}% · Aniqlik: ${acc}%`));
  const bar = el('div', 'big-bar');
  const ok = el('div', 'ok'); ok.style.width = (n ? d.c.length / n * 100 : 0) + '%';
  const bad = el('div', 'bad'); bad.style.width = (n ? d.w.length / n * 100 : 0) + '%';
  bar.append(ok, bad);
  body.appendChild(bar);

  if (d.w.length) {
    const b = el('button', 'btn', `✗ Xatolarni ishlash (${d.w.length})`);
    b.onclick = () => startSession(key, 'train', shuffle(d.w), { shuffleQ: true, shuffleA: true, timeLimit: 0 });
    body.appendChild(b);
  }
  if (d.f.length) {
    const b = el('button', 'btn secondary', `♥ Sevimlilarni ishlash (${d.f.length})`);
    b.onclick = () => startSession(key, 'train', shuffle(d.f), { shuffleQ: true, shuffleA: true, timeLimit: 0 });
    body.appendChild(b);
  }

  body.appendChild(el('div', 'sec-title', 'Urinishlar tarixi'));
  if (!d.h.length) body.appendChild(el('div', 'empty', "Hali urinishlar yo'q"));
  d.h.slice().reverse().forEach(h => {
    const r = el('div', 'hist-row');
    const dt = new Date(h.d);
    const when = `${String(dt.getDate()).padStart(2, '0')}.${String(dt.getMonth() + 1).padStart(2, '0')} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
    r.appendChild(el('span', '', `${h.m === 'e' ? '✓✓ Imtihon' : '✓ Mashq'} · ${when}`));
    r.appendChild(el('b', '', `${h.s}/${h.n} (${h.n ? Math.round(h.s / h.n * 100) : 0}%)`));
    body.appendChild(r);
  });

  const reset = el('button', 'btn outline', 'Statistikani tozalash');
  reset.style.marginTop = '20px';
  reset.onclick = () => askConfirm("Bu bank bo'yicha barcha statistika va sevimlilar o'chirilsinmi?", () => { Store.reset(key); renderStats(); });
  body.appendChild(reset);
}
$('stats-back').onclick = goBack;

loadBanks();
</script>
</body>
</html>
